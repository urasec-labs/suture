name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (stable, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        if: runner.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  analyze:
    name: end-to-end on a real binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the release binary
        run: cargo build --release -p suture-cli

      - name: Build the synthetic smoke fixture
        run: python3 tools/make-smoke-elf.py fixtures/smoke.elf

      - name: Instrument the smoke fixture
        run: ./target/release/suture instrument fixtures/smoke.elf fixtures/smoke.sutured.elf --json

      # The headline claim (C1) is that AFL++'s hashed map merges most distinct
      # edges on real control flow. This runs that measurement in CI on every
      # push, so the number in the README cannot silently drift away from what
      # the code actually does.
      - name: Measure AFL++ collision rate on a real binary
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/busybox \
            https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox
          ./target/release/suture analyze /tmp/busybox --json
          ./target/release/suture analyze /tmp/busybox \
            | tee /tmp/analysis.txt
          grep -q "VERDICT: STRONG" /tmp/analysis.txt

      - name: Instrument a real 1.1 MB binary
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/busybox \
            https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox
          ./target/release/suture instrument /tmp/busybox /tmp/busybox.sutured
